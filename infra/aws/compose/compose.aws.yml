# The AWS stack: the same five services as Railway, next to a Postgres and a
# Redis container, behind Caddy, on the one instance stack.yaml creates.
#
# Run by remote.sh on the instance, which writes the .env it is interpolated
# from (generated secrets, provider keys from Parameter Store, the image tag).
# Everything stateful is a directory under ${DATA_DIR}.

x-gateway-env: &gateway-env
  NODE_ENV: production
  DATABASE_URL: postgres://wattsteer:${POSTGRES_PASSWORD}@postgres:5432/wattsteer
  REDIS_URL: redis://redis:6379
  WATTSTEER_ML_URL: http://ml:8000
  WATTSTEER_RAG_URL: http://rag:8082
  WATTSTEER_RAG_ACCESS_TOKEN: ${WATTSTEER_RAG_ACCESS_TOKEN}
  WATTSTEER_ARCHIVE_BUCKET: ${WATTSTEER_ARCHIVE_BUCKET:-}
  WATTSTEER_ARCHIVE_REGION: ${WATTSTEER_ARCHIVE_REGION:-}
  WATTSTEER_ARCHIVE_ENDPOINT: ${WATTSTEER_ARCHIVE_ENDPOINT:-}
  WATTSTEER_ARCHIVE_ACCESS_KEY_ID: ${WATTSTEER_ARCHIVE_ACCESS_KEY_ID:-}
  WATTSTEER_ARCHIVE_SECRET_ACCESS_KEY: ${WATTSTEER_ARCHIVE_SECRET_ACCESS_KEY:-}
  WATTSTEER_ARCHIVE_RETENTION_DAYS: "90"
  XAI_API_KEY: ${XAI_API_KEY:-}

x-restart: &restart
  restart: unless-stopped

# Memory and CPU ceilings, measured on 19/09/2026 with this stack on an empty
# database through one hourly ingestion: the worker peaked at 4.7 GB and 3
# cores while parsing the plant-level constrained-off detail (660,000 rows at
# once); every other service stayed under 170 MB. Without ceilings that run
# took the event's 8 GB, 2-vCPU instance down, network and SSM included, for
# fifteen hours. The ceilings keep one core and the operating system's memory
# free whatever a service does, so a service that overruns is killed and
# restarted and the host keeps answering. Raise them on a larger instance
# (the ec2 option's t4g.xlarge has 4 vCPUs and 16 GB).
x-small: &small
  cpus: ${SERVICE_CPUS:-1}

services:
  postgres:
    <<: *restart
    # Its own CPU and memory, not the one core every small service gets: every
    # canonical read and every feature row is a query here. remote.sh sizes
    # these to the instance; the defaults are the first event box's.
    cpus: ${POSTGRES_CPUS:-1}
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    # pgvector on 16: the same major version as Railway's Postgres, with the
    # extension apps/rag needs, so both use one database as on RDS.
    image: pgvector/pgvector:pg16
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
    environment:
      POSTGRES_USER: wattsteer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wattsteer
    volumes:
      - ${DATA_DIR:-/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattsteer -d wattsteer"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    <<: [*restart, *small]
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-/data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-off, run by up.sh before the services move: `drizzle-kit migrate`.
  migrate:
    <<: *small
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    image: ${REGISTRY}/${NAME}/migrate:${IMAGE_TAG}
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://wattsteer:${POSTGRES_PASSWORD}@postgres:5432/wattsteer
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*restart, *small]
    mem_limit: ${API_MEM_LIMIT:-768m}
    image: ${REGISTRY}/${NAME}/api:${IMAGE_TAG}
    environment:
      <<: *gateway-env
      PORT: "3000"
      WATTSTEER_ROLE: api
      WATTSTEER_CORS_ORIGINS: ${PUBLIC_URL}
      WATTSTEER_PUBLIC_URL: ${PUBLIC_URL}
      WATTSTEER_TRUSTED_PROXY_DEPTH: "${TRUSTED_PROXY_DEPTH:-1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: [*restart, *small]
    # One job at a time: two detail ingestions at once would double the peak.
    mem_limit: ${WORKER_MEM_LIMIT:-5g}
    image: ${REGISTRY}/${NAME}/api:${IMAGE_TAG}
    command: ["bun", "run", "src/worker.ts"]
    environment:
      <<: *gateway-env
      WATTSTEER_ROLE: worker
      WATTSTEER_JOB_CONCURRENCY: ${WORKER_JOB_CONCURRENCY:-1}
    # The image's HEALTHCHECK probes the API port, which the worker never opens.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    <<: [*restart, *small]
    mem_limit: ${ML_MEM_LIMIT:-2g}
    image: ${REGISTRY}/${NAME}/ml:${IMAGE_TAG}
    command: ["wattsteer-ml"]
    environment:
      PORT: "8000"
      WATTSTEER_ML_ENV: production
      WATTSTEER_ML_ARTIFACT_DIR: /data/models
      DATABASE_URL: postgres://wattsteer:${POSTGRES_PASSWORD}@postgres:5432/wattsteer
    volumes:
      - ${DATA_DIR:-/data}/ml-models:/data/models
    depends_on:
      postgres:
        condition: service_healthy

  rag:
    <<: [*restart, *small]
    mem_limit: ${RAG_MEM_LIMIT:-768m}
    image: ${REGISTRY}/${NAME}/rag:${IMAGE_TAG}
    environment:
      WATTSTEER_RAG_DATABASE_URL: postgres://wattsteer:${POSTGRES_PASSWORD}@postgres:5432/wattsteer
      WATTSTEER_RAG_ACCESS_TOKEN: ${WATTSTEER_RAG_ACCESS_TOKEN}
      WATTSTEER_RAG_STORE_DIR: /data/rag-store
      WATTSTEER_RAG_MIGRATE_ON_BOOT: "1"
      WATTSTEER_RAG_INDEX_ON_BOOT: ${WATTSTEER_RAG_INDEX_ON_BOOT:-1}
      NVIDIA_API_KEYS: ${NVIDIA_API_KEYS:-}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
    volumes:
      - ${DATA_DIR:-/data}/rag-store:/data/rag-store
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: [*restart, *small]
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    image: ${REGISTRY}/${NAME}/web:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: "8080"

  # The load balancer's job on this option: /v1 and the gateway's paths to the
  # API, everything else to the site, and HTTPS when SITE_ADDRESS is a domain.
  caddy:
    <<: [*restart, *small]
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/data}/caddy:/data
      - ${DATA_DIR:-/data}/static:/srv/static:ro
    depends_on:
      - api
      - web
