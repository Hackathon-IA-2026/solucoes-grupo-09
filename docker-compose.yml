# Production topology: Redis + API (enqueue) + worker(s) (scrape).
#   docker compose up --build            # one of each
#   docker compose up --build --scale worker=3   # scale scraping out
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # persist jobs across restarts
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: . # repo root — the Dockerfile needs the root bun.lock + workspace manifests
      dockerfile: apps/api/Dockerfile
    image: zalytix:latest # the worker reuses this image
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      ZALYTIX_NO_SANDBOX: "1" # Chromium runs as root in the container
      REDIS_URL: redis://redis:6379 # overrides any .env value → in-compose Redis
      ZALYTIX_ROLE: api # enqueue async jobs; the worker service processes them
      # ZALYTIX_CORS_ORIGINS: https://zalytix.com # REQUIRED for a deployed web frontend
      # ZALYTIX_DASHBOARD: "true"   # optional BullMQ dashboard at /jobs (protect it!)
    env_file:
      - path: .env
        required: false
    shm_size: "1gb" # Chromium needs more than Docker's 64 MB /dev/shm default
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "await fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: zalytix:latest # reuses the image built by `api`
    command: ["bun", "run", "src/worker.ts"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started # ensures zalytix:latest is built first
    environment:
      NODE_ENV: production
      ZALYTIX_NO_SANDBOX: "1"
      REDIS_URL: redis://redis:6379
      ZALYTIX_ROLE: worker
    env_file:
      - path: .env
        required: false
    shm_size: "1gb"
    restart: unless-stopped
    # The worker has no HTTP server, so disable the image's /health probe;
    # liveness is "process running" (restart on crash).
    healthcheck:
      disable: true

volumes:
  redis-data:
