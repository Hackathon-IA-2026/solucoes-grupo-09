# Local topology mirroring the deployed services: Postgres + Redis + API +
# worker. The Python ML service joins this file when it exists.
#   docker compose up --build
#   docker compose up --build --scale worker=3
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wattsteer
      POSTGRES_PASSWORD: wattsteer
      POSTGRES_DB: wattsteer
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattsteer"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # persist jobs across restarts
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: . # repo root — the Dockerfile needs the root bun.lock + workspace manifests
      dockerfile: apps/api/Dockerfile
    image: wattsteer-api:latest # the worker reuses this image
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379 # overrides any .env value → in-compose Redis
      DATABASE_URL: postgres://wattsteer:wattsteer@postgres:5432/wattsteer
      WATTSTEER_ROLE: api # enqueue jobs; the worker service processes them
      # WATTSTEER_CORS_ORIGINS: https://wattsteer.com # REQUIRED for a deployed web frontend
      # WATTSTEER_DASHBOARD: "true"   # optional BullMQ dashboard at /jobs (protect it!)
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "await fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: wattsteer-api:latest # reuses the image built by `api`
    command: ["bun", "run", "src/worker.ts"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started # ensures wattsteer-api:latest is built first
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://wattsteer:wattsteer@postgres:5432/wattsteer
      WATTSTEER_ROLE: worker
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # The worker has no HTTP server, so disable the image's /health probe;
    # liveness is "process running" (restart on crash).
    healthcheck:
      disable: true

volumes:
  redis-data:
  postgres-data:
