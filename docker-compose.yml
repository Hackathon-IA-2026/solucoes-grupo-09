# Local topology mirroring the deployed services, one for one: Postgres, Redis,
# API, worker and the Python ML service. Five here, five on Railway — the whole
# point of this file is that a topology mistake surfaces locally.
#   docker compose up --build
#   docker compose up --build --scale worker=3
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wattsteer
      POSTGRES_PASSWORD: wattsteer
      POSTGRES_DB: wattsteer
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattsteer"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # persist jobs across restarts
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: . # repo root — the Dockerfile needs the root bun.lock + workspace manifests
      dockerfile: apps/api/Dockerfile
    image: wattsteer-api:latest # the worker reuses this image
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379 # overrides any .env value → in-compose Redis
      DATABASE_URL: postgres://wattsteer:wattsteer@postgres:5432/wattsteer
      WATTSTEER_ROLE: api # enqueue jobs; the worker service processes them
      # The ML service is internal: reachable on the compose network by service
      # name, never published to a browser. On Railway this is
      # http://ml.railway.internal:8000.
      WATTSTEER_ML_URL: http://ml:8000
      # WATTSTEER_CORS_ORIGINS: https://wattsteer.com # REQUIRED for a deployed web frontend
      # WATTSTEER_DASHBOARD: "true"   # optional BullMQ dashboard at /jobs (protect it!)
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "await fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: wattsteer-api:latest # reuses the image built by `api`
    command: ["bun", "run", "src/worker.ts"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started # ensures wattsteer-api:latest is built first
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://wattsteer:wattsteer@postgres:5432/wattsteer
      WATTSTEER_ROLE: worker
      WATTSTEER_ML_URL: http://ml:8000
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # The worker has no HTTP server, so disable the image's /health probe;
    # liveness is "process running" (restart on crash).
    healthcheck:
      disable: true

  ml:
    build:
      context: apps/ml # not the repo root: this service shares no lockfile with
      dockerfile: Dockerfile # the Bun workspace, so the monorepo would be dead weight
    image: wattsteer-ml:latest
    depends_on:
      postgres:
        condition: service_healthy # reads Postgres; nothing to read until it answers
    ports:
      # Published so the stub is callable during development. In production the
      # ml service has no public domain — only the gateway reaches it.
      - "${ML_PORT:-8000}:8000"
    environment:
      WATTSTEER_ML_ENV: production
      PORT: "8000"
      # Same database the gateway owns. Read-only is enforced by the ML service
      # itself (default_transaction_read_only on every connection); on Railway
      # this points at a role granted SELECT and nothing else. Drizzle owns
      # migrations — this service never runs one.
      DATABASE_URL: postgres://wattsteer:wattsteer@postgres:5432/wattsteer
      WATTSTEER_ML_ARTIFACT_DIR: /data/models
    volumes:
      # The Railway volume's local stand-in: trained artifacts must survive a
      # rebuild, or every `docker compose up --build` silently retrains.
      - ml-artifacts:/data/models
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      # Liveness only, matching the api service: the probe must not depend on
      # Postgres. Readiness lives at /ready.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
  postgres-data:
  ml-artifacts:
