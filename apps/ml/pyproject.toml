[project]
name = "wattsteer-ml"
version = "0.1.0"
description = "WattSteer ML service — features, training, inference, SHAP, backtests and the flex optimizer."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # The driver group map is a YAML data file, loaded at train time.
  "pyyaml>=6.0",
  # The flex optimizer's MILP. Pinned at >= 9.7 because that is the first
  # release shipping SCIP >= 8.0.3, the Apache-2.0 relicense — earlier SCIPs
  # were academic-use-only. See `docs/research/optimizer-formulation.md` §6.
  "ortools>=9.7",
  "holidays==0.103",
  # The forecaster's estimator family. `estimator_family ∈ {"lightgbm"}` is a
  # hot-swap gate check (`docs/specs/forecaster.md`), so the choice is part of
  # the contract rather than an implementation detail: native NULL handling,
  # a native pinball objective and native categoricals are all three load-
  # bearing for the hurdle, and none of them is available from a dependency
  # this project could substitute without changing what the artifact means.
  "lightgbm>=4.5",
  # The bundle's on-disk format. `*.joblib` is the stem the artifact layout
  # already names, and `artifacts.ARTIFACT_SUFFIX` is the one place it is spelt.
  "joblib>=1.4",
  # The baseline ladder's rungs 2 and 3 (`docs/specs/forecaster.md`). These are
  # never served and never enter an artifact: they exist so that "the model adds
  # value" is a measured delta against the interpretable and the untuned-
  # non-linear rung, on identical folds. scikit-learn supplies the L2 logistic
  # and the forests; statsmodels supplies the quantile regression the spec names
  # by library, because its IRLS is the one that stays tractable at fold scale.
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
]

[project.scripts]
wattsteer-ml = "wattsteer_ml.__main__:main"

[dependency-groups]
# `uv sync --no-dev` in the image skips these; `bun run ml:lint` needs them.
dev = [
  "ruff>=0.14",
  "mypy>=1.13",
  "pytest>=8.3",
  "httpx>=0.28",
  # `packages/core/schema/` is the cross-language authority, and the Python side
  # has to be able to *assert* against it rather than paraphrase it. Test-only:
  # the service validates nothing at runtime that the gateway did not already.
  "jsonschema>=4.23",
  "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wattsteer_ml"]

# --- Python lint/format story -------------------------------------------------
# Ruff is the whole story: linter and formatter in one binary, so there is no
# second tool to keep in sync. Biome never sees a Python file — `.py` is an
# unknown extension to it and `files.ignoreUnknown` is on — and Ruff never sees
# a TypeScript one, so the two cannot fight.
[tool.ruff]
line-length = 90 # matches biome.json's lineWidth, so both languages wrap alike
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",     # pycodestyle
  "F",     # pyflakes
  "I",     # import sorting (Biome's organizeImports equivalent)
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "ASYNC", # async correctness
  "S",     # bandit — the security/noSecrets analogue
  "RUF",
]
ignore = [
  "S101", # asserts are how pytest asserts
  # The specs this service implements are written in mathematical notation, and
  # the docstrings quote them verbatim so a reader can diff prose against code:
  # `1 - p` in a docstring is the spec's `1 − p`, `alpha` is `α`, `tau` is `τ`.
  # RUF002/RUF003 exist to catch a homoglyph smuggled into an identifier-adjacent
  # string; here every hit is a deliberate quotation, and transliterating them
  # would make the code stop matching the document it is accountable to.
  # The optimizer's docstrings quote `docs/research/optimizer-formulation.md`
  # symbol for symbol — `ηc`, `δ_b`, `Δ[t]`, `S̄`, `×`, `÷`. Transliterating
  # them would make the code and its authority impossible to read against each
  # other, which is the one thing this engine's silent failure modes require.
  # The rules only fire on prose, never on identifiers.
  "RUF001", # ambiguous unicode in a string
  "RUF002", # ambiguous unicode in a docstring
  "RUF003", # ambiguous unicode in a comment
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

# asyncpg ships no py.typed marker, so strict mode refuses to import it. The
# narrow override keeps strictness everywhere else rather than relaxing it
# globally for one dependency.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# PyYAML ships no py.typed marker either. Same narrow override, same reason:
# `driver_groups.py` narrows every value it reads out of `safe_load` before
# using it, so nothing untyped escapes the loader.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# `holidays` ships typed modules but re-exports `Brazil` through
# `holidays.countries` implicitly, which strict mode refuses to follow. The
# narrow override buys that one import rather than relaxing reexport rules
# everywhere; `calendar_generator.py` is the only module that imports it.
[[tool.mypy.overrides]]
module = ["holidays.*"]
no_implicit_reexport = false

# OR-Tools ships `pywraplp.pyi` but no `py.typed` marker, so strict mode will
# not read it. Same narrow override, same reason: one untyped dependency should
# not cost strictness anywhere else. `optimizer/milp.py` is the only module that
# touches the solver handles, and it copies every value out through `float()`.
[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# LightGBM ships no `py.typed` marker, so strict mode refuses to import it. The
# same narrow override the other four untyped dependencies get, and for the same
# reason: `training/bundle.py` and `training/hurdle.py` are the only modules
# that touch a `Booster`, and every prediction is copied out through `float()`
# before anything else sees it.
[[tool.mypy.overrides]]
module = ["lightgbm.*"]
ignore_missing_imports = true

# joblib ships no marker either. `training/bundle.py` is the only module that
# calls it, and it re-validates the loaded object field by field rather than
# trusting the pickle's shape.
[[tool.mypy.overrides]]
module = ["joblib.*"]
ignore_missing_imports = true

# scikit-learn and statsmodels ship no `py.typed` marker either. The same narrow
# override the other untyped dependencies get, and for the same reason:
# `evaluation/ladder.py` is the only module that touches an estimator handle,
# and every prediction is copied out through `float()` or `np.asarray(...,
# dtype=np.float64)` before anything else sees it.
[[tool.mypy.overrides]]
module = ["sklearn.*", "statsmodels.*"]
ignore_missing_imports = true
