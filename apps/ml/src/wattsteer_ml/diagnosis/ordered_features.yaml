# The ordered feature list, transcribed from `docs/specs/feature-engineering.md`.
#
# WHY THIS FILE EXISTS, AND WHAT REPLACES IT
# ------------------------------------------
# The group map is tested for totality against *the artifact's* ordered feature
# list. No artifact exists yet — the feature builder is a feature-engineering
# ticket — so the list is transcribed here from its naming authority, in the
# order the spec's feature table lists it, and the test runs against this. When
# the builder lands, `assert_total_partition` takes the artifact's names instead
# and this file goes away: the function already takes the names as an argument,
# so the substitution is one call site.
#
# Nothing here is a definition. `docs/specs/feature-engineering.md` "The feature
# table" is the authority for every name, and the transcription is deliberately
# a second copy so that a divergence between it and the group map fails the
# totality test rather than passing silently.
#
# Labels (`y_*`) are not features and are not listed. `y_has_curtailment` is
# derived inside the feature function and never stored.
#
# `subsystem` is listed: the row grain is (subsystem, valid_time), the model is
# trained across all four, and the attribution background is matched on it —
# which only means anything if it is a model input.

