[project]
name = "wattsteer-rag"
version = "0.1.0"
description = "Evidence retrieval over the ONS public record: it finds, quotes and cites. It never classifies."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "pyyaml>=6.0",
  "tiktoken>=0.8",
]

[project.optional-dependencies]
redis = ["redis>=5.2"]
rerank = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "jsonschema>=4.23"]

[project.scripts]
wattsteer-rag = "wattsteer_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wattsteer_rag"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# console.py is one page of HTML held in a string; a Python line-length rule
# would only make the markup harder to read.
"src/wattsteer_rag/console.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
