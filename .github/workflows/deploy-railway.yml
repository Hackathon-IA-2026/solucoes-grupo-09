# Deploy to Railway from GitHub, and hand it the state a laptop trained.
#
# Two jobs, because they are two decisions. `deploy` pushes the code Railway is
# already able to build; `state` puts the retrain's artifacts on the volume and
# the scored forecast rows in Postgres — the pair no build can produce, because
# they came out of a run on somebody's machine.
#
# It never runs on a push, for the reason `deploy-aws.yml` gives: a deploy is a
# decision, and the `railway` environment can require a reviewer before the job
# starts (Settings → Environments → railway → Required reviewers).
#
# ## What it needs, once
#
#   secrets: RAILWAY_TOKEN — a *project* token (Railway → wattsteer → Settings →
#            Tokens), scoped to the environment below. Revocable, and not tied
#            to a person, which is the point: whoever holds the project can add
#            it and nobody has to run anything locally afterwards.
#
# If the project already deploys from GitHub, run this with `services: none` and
# `ship_state: true` — the integration builds the code and this brings the part
# it cannot know about.
#
# `with_rag` replaces the whole evidence corpus. It is on by default since
# `state-2026-09-23`, whose corpus (28,340 chunks, BDO to 21/09) is the fullest
# that exists; anything Railway fetched after it was packed is fetched again by
# the daily refresh, which fills any missing bulletin of the last week (#45).
# Turn it off for a release older than what Railway has indexed.
#
# `rag` and `worker` were missing from the services: the evidence service's
# fixes of 22-23/09 (#41-#45) and the worker's schedules reached Railway only if
# the project happened to deploy from GitHub. `GEMINI_API_KEYS` is optional: if
# the repository has that secret, the rag service gets it (the free Gemma
# fallback, #42); if not, the service runs without that link.
name: deploy-railway

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Which services to push, in the order deploy.md gives"
        type: choice
        options: [none, all, rag, ml, api, worker, web]
        default: none
      ship_state:
        description: "Also ship the artifacts and forecast rows"
        type: boolean
        default: true
      state_tag:
        description: "Release holding models.tgz and forecasts.sql.gz"
        type: string
        default: state-2026-09-23
      with_rag:
        description: "Also replace the RAG corpus with the release's (see the header)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # One at a time: two runs restoring the same three tables would interleave a
  # truncate with an insert, and the loser would leave a half-filled table.
  group: deploy-railway
  cancel-in-progress: false

jobs:
  configure:
    # Its own job, so it runs whatever `services` says (a project that builds
    # from GitHub runs this workflow with `services: none`), and the key is read
    # by one step only: the one that writes it to Railway.
    runs-on: ubuntu-latest
    environment: railway
    steps:
      - name: Install the Railway CLI
        run: npm install -g @railway/cli
      - name: Give the rag service the optional Gemma key
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        # From stdin, so the key is never an argument a process listing shows.
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEYS" ]; then
            echo "no GEMINI_API_KEYS secret: the rag service keeps the chain it has"
            exit 0
          fi
          printf '%s' "$GEMINI_API_KEYS" | railway variables --service rag --set-from-stdin GEMINI_API_KEYS --skip-deploys

  deploy:
    needs: [configure]
    if: inputs.services != 'none'
    runs-on: ubuntu-latest
    environment: railway
    steps:
      - uses: actions/checkout@v4
      - name: Install the Railway CLI
        run: npm install -g @railway/cli
      - name: Push the services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          # rag → ml → api → worker → web: the gateway and the worker call the
          # evidence and modelling services, and the site calls the gateway, so
          # the other order ships a caller asking for routes nothing serves yet.
          # `--ci` streams the build and returns when it is done, failing the job
          # on a failed build; `--detach` returned at once, so the order was only
          # the order the builds were queued in, and the corpus restore could
          # start while the new rag service was still coming up.
          for service in rag ml api worker web; do
            if [ "${{ inputs.services }}" = "all" ] || [ "${{ inputs.services }}" = "$service" ]; then
              echo "== $service"
              railway up --service "$service" --ci
            fi
          done

  state:
    # `always()` so state can be shipped without a deploy — the common case is a
    # project that already builds from GitHub — while still waiting for one when
    # it was asked for.
    needs: [configure, deploy]
    if: ${{ always() && inputs.ship_state && !cancelled() }}
    runs-on: ubuntu-latest
    environment: railway
    steps:
      - uses: actions/checkout@v4
      - name: Install the Railway CLI and psql
        run: |
          npm install -g @railway/cli
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Ship the artifacts and the forecast rows
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: infra/railway/ship-state.sh --from-release "${{ inputs.state_tag }}"
      - name: Ship the RAG corpus, when the release carries one
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        if: ${{ inputs.with_rag }}
        run: infra/railway/ship-rag.sh --from-release "${{ inputs.state_tag }}"
