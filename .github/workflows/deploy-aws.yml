# Deploy every push to main to the AWS stack (infra/aws/stack.yaml).
#
# The same command as on a laptop, infra/aws/deploy.sh: archive the commit into
# the stack's bucket and start the CodeBuild project, which builds the images on
# arm64 and ships them to the instance. No keys are stored in GitHub: the job
# assumes the stack's GitHubRole through OIDC, which trusts only this
# repository's main branch.
name: deploy-aws

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Read the stack outputs
        run: cat infra/aws/stack.env | grep -v '^#' >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.GIT_HUB_ROLE_ARN }}
      - name: Deploy
        env:
          # The runner has the CLI already; the laptop wrapper runs it in Docker.
          AWS_CLI: aws
        run: infra/aws/deploy.sh
