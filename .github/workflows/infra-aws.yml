# Checks the AWS deployment's own files. Runs only when they change, so it
# never slows or fails anything else.
name: infra-aws

on:
  pull_request:
    paths: ["infra/aws/**", ".github/workflows/*-aws.yml"]
  push:
    branches: [main]
    paths: ["infra/aws/**", ".github/workflows/*-aws.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck infra/aws/*.sh infra/aws/scripts/*.sh
      - name: cfn-lint
        run: |
          pip install --quiet cfn-lint
          cfn-lint infra/aws/stack.yaml
