# WattSteer LLM gateway: providers, limits and the fallback chain per task.
# Validated by docs/rag/llm-gateway-config.schema.json. Keys never live here,
# only the name of the environment variable that carries them.
#
# Two providers, both free and neither asks for a card. NVIDIA does all the work;
# Groq is the fallback for generation when every NVIDIA key is out of quota. One
# key is enough. Several keys in the same variable, separated by commas, are
# treated as independent quotas: the router uses the key with the most room and
# only moves to the next provider when every key of the current one is spent.
version: 1

providers:
  nvidia:
    kind: openai_compatible
    base_url: https://integrate.api.nvidia.com/v1
    api_keys_env: NVIDIA_API_KEYS # "nvapi-...,nvapi-..." or a single key
    timeout_s: 60
    # NVIDIA does not publish limits. Measured on 15/09/2026: the request rate is
    # what limits a run, not tokens; a 429 is handled by the router's cooling.
    limits: { rpm: 30, tpm: 60000, rpd: 4000 }
    limits_per_model:
      nvidia/nemotron-3-embed-1b: { rpm: 30, rpd: 4000 }
      nvidia/nemotron-parse: { rpm: 30, rpd: 4000 }
    extra:
      # Nemotron reasons out loud unless told not to, and the knob is NVIDIA's
      # own (chat_template_kwargs). Groq answers 400 to it, so it stays here.
      thinking_toggle: true
  groq:
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_keys_env: GROQ_API_KEYS # Groq meters per organisation: one key per member's org
    timeout_s: 45
    limits_per_model: # official free tier table, 15/09/2026, per organisation
      openai/gpt-oss-120b: { rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000 }
  local:
    kind: local # poppler's text layer: no network, no quota, worse on scans
    api_key_env: null
    limits: { rpm: 600 }

tasks:
  # Open models only. NIM ids confirmed on 15/09/2026 via GET /v1/models.
  generate_strong: # the evidence builder: strict JSON, temperature 0
    chain:
      - { provider: nvidia, model: nvidia/nemotron-3-super-120b-a12b, max_input_tokens: 24000 }
      - { provider: nvidia, model: moonshotai/kimi-k3, max_input_tokens: 24000 }
      - { provider: groq, model: openai/gpt-oss-120b, max_input_tokens: 6000 } # TPM 8k
    require: { json_schema: true }
    temperature: 0
    max_output_tokens: 1500
    on_exhausted: waiting_quota # the job waits; never an error
  embed: # NEVER changes model at runtime: one vector space per index.
    # bge-m3, llama-nemotron-embed-1b-v2 and nv-embedqa-e5-v5 were retired by NIM
    # on 25/08/2026 (410 Gone). nemotron-3-embed-1b: 2048 dims, sliced to 1024 and
    # re-normalised, 34 languages including Portuguese, 32k context, open weights.
    # There is no fallback in the same vector space: if the model disappears the
    # answer is a re-index with another model, which is a declared procedure.
    model: nvidia/nemotron-3-embed-1b
    dimensions: 1024
    chain:
      - { provider: nvidia, model: nvidia/nemotron-3-embed-1b }
    batch_size: 32
    on_exhausted: waiting_quota
  parse: # a PDF page as an image -> typed blocks with tables. 2.2 s/page measured on a real BDO.
    # The answer arrives as a `markdown_bbox` tool call: blocks (Page-header, Text,
    # Table, Page-footer) with a normalised bbox; tables in LaTeX tabular.
    chain:
      - { provider: nvidia, model: nvidia/nemotron-parse }
      - { provider: local, model: pdftotext } # the text layer, when the page has one
    on_exhausted: waiting_quota # a document is never lost: wait for quota or take the text layer

behaviour:
  counters: memory # fixed windows per (provider, key, model): rpm, tpm, rpd, tpd
  preflight: true # estimates tokens before choosing the link
  cooling_s_default: 60 # after a 429/5xx/timeout without Retry-After
  retry_same_link: 0 # never retries the same link; moves on with the SAME payload
  invalid_json_counts_as_failure: true
  log_table: rag.llm_call # provider, model, attempt, latency_ms, tokens_in/out, error, trace_id
  quota_endpoint: /internal/llm/quota
